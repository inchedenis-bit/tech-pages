    function showToast(type, title, message) {
      var container = document.getElementById('wp-toast-container');
      var toast = document.createElement('div');
      toast.className = 'wp-toast ' + type;
      var icon = type === 'success' ? '✅' : '⚠️';
      toast.innerHTML = `<div class="wp-toast-icon">${icon}</div><div class="wp-toast-content"><div class="wp-toast-title">${title}</div><div class="wp-toast-msg">${message}</div></div>`;
      container.appendChild(toast);

      setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 400); }, 4500);
    }

    var policyModal = document.getElementById('wp-policy-modal');

    var policyLabel = document.querySelector('.wp-policy-check');

      policyLabel.addEventListener('click', function(e) {
        setTimeout(function() {
          if (policyCheckbox.checked) policyBtn.removeAttribute('disabled');
          else policyBtn.setAttribute('disabled', 'true');
        }, 10);
      });
    }

    policyCheckbox?.addEventListener('change', function() {
      if (this.checked) policyBtn.removeAttribute('disabled');
      else policyBtn.setAttribute('disabled', 'true');
    });

    policyBtn?.addEventListener('click', async function() {
      if (!currentWriter) return;
      policyBtn.textContent = 'Saving...';
      try {
        var res = await fetch(WORKER_URL + '/writer/agree-policy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ writerId: currentWriter.id }) });
        var data = await res.json();

          submitBox.classList.remove('disabled');
          policyWarning.style.display = 'none';
          document.getElementById('wp-submit-article').disabled = false;
          showToast('success', 'Policy Accepted', 'You can now submit articles.');

          showToast('warning', 'Error', 'Could not save your agreement. Please try again.');

          draftIndicator.textContent = '✅ Draft saved';
          setTimeout(function() { draftIndicator.style.opacity = '0'; }, 2000);

          setTimeout(function() { draftIndicator.style.opacity = '0'; }, 2000);
        }
      }, 2000);

    artTitle?.addEventListener('input', triggerDraftSave);
    artContent?.addEventListener('input', triggerDraftSave);

    if (window.location.search.indexOf('verified=true') !== -1) {
      overlay.classList.add('active');
      var sb = document.getElementById('wp-success');
      sb.textContent = '✅ Email verified successfully! You can now log in.';

        e.preventDefault();

      var mpesa = document.getElementById('wp-mpesa').value;

        if (data.success) {
          if (isRegisterMode) {

          var amountClass = item.type === 'credit' ? 'credit' : 'debit';
          var sign = item.type === 'credit' ? '+' : '-';
          div.innerHTML = `<div style="display:flex; align-items:center;"><div class="wp-ledger-icon ${iconClass}">${icon}</div><div class="wp-ledger-details"><div class="wp-ledger-title">${item.title}</div><div class="wp-ledger-date">${new Date(item.date).toLocaleString()}</div></div></div><div class="wp-ledger-amount ${amountClass}">${sign} KES ${item.amount.toLocaleString()}</div>`;
          body.appendChild(div);
        });
      }
      document.getElementById('wp-ledger-modal').style.display = 'flex';
    });

    document.getElementById('wp-ledger-close')?.addEventListener('click', function () {
      document.getElementById('wp-ledger-modal').style.display = 'none';
    });

    document.getElementById('wp-submit-article')?.addEventListener('click', async function () {
      if (currentWriter.policy_agreed === 0) { showToast('warning', 'Policy Required', 'You must accept the Writer Policy before submitting.'); return; }
      var title = document.getElementById('wp-art-title').value;
      var content = document.getElementById('wp-art-content').value;
      if (!title || !content) { showToast('warning', 'Missing Fields', 'Please fill in both the title and article content.'); return; }
      var assignmentId = document.getElementById('wp-submit-area').getAttribute('data-assignment-id');
      var bodyData = { writerId: currentWriter.id, title: title, content: content };
      if (assignmentId) bodyData.assignmentId = parseInt(assignmentId);

      var res = await fetch(WORKER_URL + '/writer/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData) });
      var data = await res.json();
      if (data.success) {
        showToast('success', 'Article Submitted', 'Your article is now pending review.');
        document.getElementById('wp-art-title').value = '';
        document.getElementById('wp-art-content').value = '';
        document.getElementById('wp-submit-area').removeAttribute('data-assignment-id');
        showDashboard();
      } else {
        showToast('warning', 'Submission Error', data.error || 'Failed to submit article.');
      }
    });

    document.getElementById('wp-modal-close')?.addEventListener('click', function () {
      document.getElementById('wp-article-modal').style.display = 'none';
    });

    function animateValue(id, start, end, duration) {
      var obj = document.getElementById(id);
      if (!obj) return;
      var isCurrency = id === 'wp-stat-earned' || id === 'wp-stat-withdrawable';
      var range = end - start;
      var current = start;
      if (range === 0) { if (isCurrency) obj.textContent = 'KES ' + end.toLocaleString(); return; }
      if (obj._timer) clearInterval(obj._timer);
      var increment = end > start ? 1 : -1;
      var stepTime = Math.abs(Math.floor(duration / range));
      obj._timer = setInterval(function() {
        current += increment;
        if (isCurrency) obj.textContent = 'KES ' + current.toLocaleString();
        else obj.textContent = current;
        if (current == end) {
          clearInterval(obj._timer);
          if (isCurrency) obj.textContent = 'KES ' + end.toLocaleString();
        }
      }, stepTime || 10);
    }

    function drawChart(elementId, progress, isInverted) {
      var svg = document.getElementById(elementId);
      if (!svg) return;
      var path = svg.querySelector('path');
      if (progress <= 0.01) { path.setAttribute('d', 'M0,30 L100,30'); return; }
      var endY = 30 - (progress * 25); var startY = 30; var cp1x = 30; var cp1y = startY; var cp2x = 70; var cp2y = endY;
      if (isInverted) { startY = 5; endY = 5 + (progress * 25); cp1y = startY; cp2y = endY; }
      var d = `M0,${startY} C${cp1x},${cp1y} ${cp2x},${cp2y} 100,${endY}`;
      path.setAttribute('d', d);
    }

    async function showDashboard() {
      document.getElementById('wp-auth-view').style.display = 'none';
      document.getElementById('wp-dash-view').style.display = 'block';
      
      var res = await fetch(WORKER_URL + '/writer/dashboard?writerId=' + currentWriter.id);
      var data = await res.json();
      if (!data.success) return;

      if (data.writer_grade) currentWriter.writer_grade = data.writer_grade;
      
      var grade = currentWriter.writer_grade || 'C';
      var badgeHTML = '';
      if (grade === 'A') badgeHTML = '<span class="writer-badge badge-a">🥇 Elite Writer</span>';
      else if (grade === 'B') badgeHTML = '<span class="writer-badge badge-b">🥈 Senior Writer</span>';
      else if (grade === 'D') badgeHTML = '<span class="writer-badge badge-d">✍️ Contributor</span>';
      else badgeHTML = '<span class="writer-badge badge-c">🥉 Staff Writer</span>';

      document.getElementById('wp-welcome').innerHTML = 'Welcome back, ' + currentWriter.name + ' 👋' + badgeHTML;

      var writerMpesa = currentWriter.mpesa_number || currentWriter.mpesa || data.mpesa_number;
      document.getElementById('wp-mpesa-display').textContent = '📱 M-Pesa: ' + (writerMpesa || 'Not Provided');

      allArticles = data.articles || [];
      allAssignments = data.assignments || [];

      if (data.draft) {
        document.getElementById('wp-art-title').value = data.draft.title || '';
        document.getElementById('wp-art-content').value = data.draft.content || '';
      }

      var totalEarned = data.totalEarned || 0;
      var withdrawable = data.withdrawable || 0;

      allPayouts = [];
      allArticles.forEach(function(a) {
        if (a.status === 'approved' && a.payment_amount > 0) {
          allPayouts.push({ type: 'credit', title: 'Article Approved: ' + a.title, amount: a.payment_amount, date: a.submitted_at });
        }
      });
      if (data.payouts) {
        data.payouts.forEach(function(p) {
          allPayouts.push({ type: 'debit', title: 'Payout to M-Pesa (' + (p.status || 'pending') + ')', amount: p.amount, date: p.created_at });
        });
      }
      allPayouts.sort(function(a,b) { return new Date(b.date) - new Date(a.date); });

      var seoImp = 0; var seoCtr = '0%'; var seoPos = '#14'; var rating = 'average';
      var approvedArticles = allArticles.filter(function(a) { return a.status === 'approved'; });
      
      if (approvedArticles.length > 0) {
        var oldestDate = new Date().getTime();
        approvedArticles.forEach(function(a) { var d = new Date(a.submitted_at).getTime(); if (d < oldestDate) oldestDate = d; });
        var daysPassed = (new Date().getTime() - oldestDate) / (1000 * 60 * 60 * 24);
        var timeProgress = Math.min(daysPassed / 90, 1); 
        var seed = currentWriter.id * 7 + 13; 
        function pseudoRandom(min, max) { var x = Math.sin(seed++) * 10000; return Math.floor((x - Math.floor(x)) * (max - min + 1)) + min; }

        var minImp = 12700, maxImp = 14000; var minCtr = 50, maxCtr = 70; var minPos = 17, maxPos = 19;
        if (grade === 'A') { minImp = 16000; maxImp = 18600; minCtr = 75; maxCtr = 95; minPos = 20; maxPos = 22; }
        else if (grade === 'B') { minImp = 14000; maxImp = 16000; minCtr = 70; maxCtr = 80; minPos = 19; maxPos = 20; }
        else if (grade === 'D') { minImp = 5000; maxImp = 8000; minCtr = 20; maxCtr = 45; minPos = 14; maxPos = 16; }

        var targetImp = pseudoRandom(minImp, maxImp);
        var targetCtr = pseudoRandom(minCtr, maxCtr) / 10; 
        var targetPos = pseudoRandom(minPos, maxPos); 
        
        seoImp = Math.floor(targetImp * timeProgress);
        seoCtr = (targetCtr * timeProgress).toFixed(1) + '%';
        seoPos = '#' + Math.round(14 + ((targetPos - 14) * timeProgress));
        if (timeProgress > 0.75) rating = 'excellent';
        else if (timeProgress > 0.4) rating = 'good';
      }

      var ratingText = rating.charAt(0).toUpperCase() + rating.slice(1).replace('-', ' ');
      ['wp-badge-imp', 'wp-badge-ctr', 'wp-badge-pos'].forEach(function (id) {
        var el = document.getElementById(id);
        el.className = 'wp-seo-badge ' + rating;
        el.textContent = ratingText;
      });

      if (window._seoImpTimer) clearInterval(window._seoImpTimer);
      if (window._seoCtrTimer) clearInterval(window._seoCtrTimer);
      if (window._seoPosTimer) clearInterval(window._seoPosTimer);

      var currentImp = 0; var currentCtr = 0.0; var currentPos = 14;
      document.getElementById('wp-seo-imp').textContent = '0';
      document.getElementById('wp-seo-ctr').textContent = '0%';
      document.getElementById('wp-seo-pos').textContent = '#14';

      setTimeout(function() {
        if (seoImp > 0) {
          var stepImp = Math.max(1, Math.ceil(seoImp / 50));
          window._seoImpTimer = setInterval(function() {
            currentImp += stepImp;
            if (currentImp >= seoImp) { currentImp = seoImp; clearInterval(window._seoImpTimer); }
            document.getElementById('wp-seo-imp').textContent = currentImp.toLocaleString();
            drawChart('chart-imp', currentImp / seoImp, false);
          }, 20);
        }
        var targetCtrVal = parseFloat(seoCtr) || 0;
        if (targetCtrVal > 0) {
          var stepCtr = targetCtrVal / 30;
          window._seoCtrTimer = setInterval(function() {
            currentCtr += stepCtr;
            if (currentCtr >= targetCtrVal) { currentCtr = targetCtrVal; clearInterval(window._seoCtrTimer); }
            document.getElementById('wp-seo-ctr').textContent = currentCtr.toFixed(1) + '%';
            drawChart('chart-ctr', currentCtr / targetCtrVal, false);
          }, 30);
        }
        var targetPosVal = parseInt(seoPos.replace('#', '')) || 14;
        if (targetPosVal > 14) {
          window._seoPosTimer = setInterval(function() {
            currentPos++;
            if (currentPos >= targetPosVal) { currentPos = targetPosVal; clearInterval(window._seoPosTimer); }
            document.getElementById('wp-seo-pos').textContent = '#' + currentPos;
            drawChart('chart-pos', (currentPos - 14) / (targetPosVal - 14), true);
          }, 100);
        }
      }, 100);

      document.getElementById('wp-stat-total').textContent = '0';
      document.getElementById('wp-stat-approved').textContent = '0';
      document.getElementById('wp-stat-pending').textContent = '0';
      document.getElementById('wp-stat-earned').textContent = 'KES 0';
      document.getElementById('wp-stat-withdrawable').textContent = 'KES 0';

      setTimeout(function() {
        animateValue('wp-stat-total', 0, allArticles.length, 1000);
        animateValue('wp-stat-approved', 0, data.approvedCount || 0, 1000);
        animateValue('wp-stat-pending', 0, data.pendingCount || 0, 1000);
        animateValue('wp-stat-earned', 0, totalEarned, 1200);
        animateValue('wp-stat-withdrawable', 0, withdrawable, 1400);
      }, 100);

      document.querySelectorAll('.wp-nav-item[data-tab]').forEach(function (b) { b.classList.remove('active'); });
      document.querySelector('.wp-nav-item[data-tab="dashboard"]').classList.add('active');
      document.querySelectorAll('.wp-tab').forEach(function (t) { t.classList.remove('active'); });
      document.getElementById('wp-tab-dashboard').classList.add('active');

      if (currentWriter.policy_agreed === 1) {
        submitBox.classList.remove('disabled');
        policyWarning.style.display = 'none';
        document.getElementById('wp-submit-article').disabled = false;
      }

      startTasksPolling();
    }

    function renderTaskList() {
      var container = document.getElementById('wp-task-list');
      container.innerHTML = '';
      if (timerInterval) clearInterval(timerInterval);

      if (!allAssignments.length) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding: 40px;">No assignments yet. You are all caught up!</p>';
        return;
      }

      allAssignments.forEach(function(task) {
        var card = document.createElement('div');
        card.className = 'task-card';
        var statusBadge = ''; var actionHTML = ''; var timerHTML = '';

        if (task.status === 'pending') {
          statusBadge = `<span style="font-size:11px; font-weight:700; color:#3973D4; background:#eff6ff; padding:4px 8px; border-radius:20px;">New Task</span>`;
          timerHTML = `<div class="task-timer" id="accept-timer-${task.id}">⏳ Calculating accept time...</div>`;
          actionHTML = `<button class="task-btn" onclick="acceptTask(${task.id})">Accept Task</button>`;
        } else if (task.status === 'in_progress') {
          statusBadge = `<span style="font-size:11px; font-weight:700; color:#f59e0b; background:#fef3c7; padding:4px 8px; border-radius:20px;">In Progress</span>`;
          timerHTML = `<div class="task-timer" id="submit-timer-${task.id}">⏳ Calculating submit time...</div>`;
          actionHTML = `<button class="task-btn" onclick="prepSubmitTask(${task.id}, '${task.title.replace(/'/g, "\\'")}')">Submit Article</button>`;
        } else if (task.status === 'expired') {
          statusBadge = `<span style="font-size:11px; font-weight:700; color:#ef4444; background:#fee2e2; padding:4px 8px; border-radius:20px;">Expired</span>`;
          timerHTML = `<div class="task-timer urgent">⌛ Time expired</div>`;
        }

        card.innerHTML = `<div class="task-card-header"><h3 class="task-card-title">${task.title}</h3>${statusBadge}</div><div class="task-card-desc">${task.description || 'No specific description provided.'}</div><div class="task-card-footer">${timerHTML}<div>${actionHTML}</div></div>`;
        container.appendChild(card);

        if (task.status === 'pending' || task.status === 'in_progress') {
          startTimer('accept-timer-' + task.id, task.minutes_left, 'to ' + (task.status === 'pending' ? 'accept' : 'submit'));
        }
      });
    }

    function startTimer(elementId, totalMinutes, actionText) {
      if (totalMinutes <= 0) {
        var el = document.getElementById(elementId);
        if (el) { el.textContent = '⌛ Time expired'; el.classList.add('urgent'); }
        return;
      }
      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;
      var el = document.getElementById(elementId);
      if (el) {
        el.textContent = `⏳ ${hours}h ${mins}m left ${actionText}`;
        if (hours < 24) el.classList.add('urgent');
      }
    }

    window.acceptTask = async function(taskId) {
      try {
        var res = await fetch(WORKER_URL + '/writer/accept-assignment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ writerId: currentWriter.id, assignmentId: taskId }) });
        var data = await res.json();
        if (data.success) {
          showToast('success', 'Task Started', 'Your 72-hour timer has started.');
          showDashboard();
          switchToTab('tasks');
        }
      } catch (e) { showToast('warning', 'Error', 'Could not accept task.'); }
    };

    window.prepSubmitTask = function(taskId, taskTitle) {
      var submitArea = document.getElementById('wp-submit-area');
      submitArea.setAttribute('data-assignment-id', taskId);
      document.getElementById('wp-art-title').value = taskTitle;
      switchToTab('dashboard');
      document.getElementById('wp-art-content').focus();
      showToast('success', 'Ready to Submit', 'Write your article below and hit submit.');
    };

    function renderArticleList() {
      var list = document.getElementById('wp-article-list');
      list.innerHTML = '';
      if (!allArticles.length) { list.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;">No articles yet.</td></tr>'; return; }

      allArticles.forEach(function (article, index) {
        var tr = document.createElement('tr');
        var noteDisplay = article.editor_notes ? '<span class="wp-note-badge" title="' + escapeAttr(article.editor_notes) + '">📝 ' + escapeHtml(article.editor_notes) + '</span>' : '<span style="color:#cbd5e1;font-size:12px;">None</span>';
        var d = new Date(article.submitted_at);
        var dateStr = d.toLocaleDateString('en-KE', { month: 'short', day: 'numeric', year: 'numeric' });
        var timeStr = d.toLocaleTimeString('en-KE', { hour: '2-digit', minute: '2-digit' });
        tr.innerHTML = '<td data-label="Title"><strong>' + escapeHtml(article.title) + '</strong></td><td data-label="Date"><div>' + dateStr + '</div><div style="font-size:12px;color:#64748b;">' + timeStr + '</div></td><td data-label="Status"><span class="wp-status ' + article.status + '">' + article.status + '</span></td><td data-label="Editor Note">' + noteDisplay + '</td><td data-label="Action"><button class="wp-read-btn" data-idx="' + index + '" style="background:#3973D4;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;">📖 Read</button></td>';
        list.appendChild(tr);
      });

      list.querySelectorAll('.wp-read-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { openArticle(parseInt(btn.getAttribute('data-idx'), 10)); });
      });
    }

    async function openArticle(index) {
      var article = allArticles[index];
      if (!article) return;
      document.getElementById('wp-modal-title').textContent = article.title;
      var contentHTML = '';
      if (article.editor_notes && article.editor_notes.trim() !== '') { contentHTML += '<div class="wp-editor-note"><h4>📝 Note from Editor:</h4><p>' + escapeHtml(article.editor_notes) + '</p></div>'; }
      contentHTML += escapeHtml(article.content);
      contentHTML += `<div class="thread-container"><h4 style="margin: 0 0 10px 0; color: #1e293b; font-size: 16px;">💬 Feedback Thread</h4><div id="thread-messages" style="margin-bottom: 15px;"><p style="color: #94a3b8; font-size: 13px; font-style: italic;">Loading replies...</p></div><div class="thread-input-wrap"><input type="text" id="thread-input" placeholder="Reply to editor..."><button id="thread-send-btn">Send</button></div></div>`;
      document.getElementById('wp-modal-body').innerHTML = contentHTML;
      document.getElementById('wp-article-modal').style.display = 'flex';

      try {
        var rRes = await fetch(WORKER_URL + '/writer/replies?articleId=' + article.id);
        var rData = await rRes.json();
        var msgBox = document.getElementById('thread-messages');
        if (rData.success && rData.replies.length > 0) {
          msgBox.innerHTML = '';
          rData.replies.forEach(function(rep) { msgBox.innerHTML += `<div class="thread-bubble"><div>${rep.message}</div><small>${new Date(rep.created_at).toLocaleString()}</small></div>`; });
        } else {
          msgBox.innerHTML = '<p style="color: #94a3b8; font-size: 13px; font-style: italic;">No replies yet. Send a message below.</p>';
        }
      } catch(e) { document.getElementById('thread-messages').innerHTML = '<p style="color:#ef4444; font-size:13px;">Failed to load thread.</p>'; }

      document.getElementById('thread-send-btn').addEventListener('click', async function() {
        var input = document.getElementById('thread-input');
        var msg = input.value.trim();
        if (!msg) return;
        input.disabled = true; this.disabled = true; this.textContent = 'Sending...';
        try {
          var sRes = await fetch(WORKER_URL + '/writer/reply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ writerId: currentWriter.id, articleId: article.id, message: msg }) });
          var sData = await sRes.json();
          if (sData.success) {
            input.value = '';
            showToast('success', 'Reply Sent', 'Your message has been sent to the editor.');
            if (article.status === 'rejected') { article.status = 'pending'; renderArticleList(); }
            openArticle(index);
          } else {
            showToast('warning', 'Error', 'Could not send reply.');
            input.disabled = false; this.disabled = false; this.textContent = 'Send';
          }
        } catch(e) {
          showToast('warning', 'Network Error', 'Could not send reply.');
          input.disabled = false; this.disabled = false; this.textContent = 'Send';
        }
      });
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function escapeAttr(str) { return escapeHtml(str).replace(/\n/g, ' '); }
  }
})();
</script>
</body>
</html>
